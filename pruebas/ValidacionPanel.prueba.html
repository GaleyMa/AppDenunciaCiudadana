<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pruebas — ValidacionPanel y GestorValidacion</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #f0f0f0; }
        li { margin: 4px 0; }
        .ok { color: #0a7d33; }
        .fail { color: #b00020; font-weight: bold; }
        #resumen { font-size: 1.1rem; margin-top: 15px; }
        iframe { width: 520px; height: 420px; border: 1px solid #ccc; background: #fff; }
        .alerta { background: #fdf3f4; border-left: 3px solid #b00020; padding: 10px 12px; }
        button { padding: 10px 16px; font: inherit; cursor: pointer; }
    </style>
</head>

<body>
    <h1>Pruebas del Incremento 2</h1>
    <p class="alerta">⚠️ Esta suite maneja el <code>index.html</code> real, así
        que trabaja sobre la base real y <strong>borra todos los reportes que
        tengas guardados</strong>. No la ejecutes si quieres conservarlos.</p>
    <p><button id="btn-correr" type="button">Ejecutar pruebas</button></p>
    <ul id="salida"></ul>
    <p id="resumen"></p>
    <div id="host"></div>

    <script type="module">
        import { TOKEN_PANEL, RUTA_PANEL } from '../src/config.js';
        import GestorValidacion from '../src/reportes/validacion/GestorValidacion.js';
        import ReporteStore from '../src/reportes/store/ReporteStore.js';

        const salida = document.getElementById('salida');
        let pasadas = 0, fallidas = 0;

        const comprobar = (condicion, texto) => {
            condicion ? pasadas++ : fallidas++;
            salida.insertAdjacentHTML('beforeend',
                `<li class="${condicion ? 'ok' : 'fail'}">${condicion ? 'PASS' : 'FALLO'} — ${texto}</li>`);
        };

        const espera = (ms) => new Promise((r) => setTimeout(r, ms));

        // No corre sola: hay que pulsar el botón, para no borrar por
        // accidente los reportes reales al abrir la página.
        const boton = document.getElementById('btn-correr');
        boton.addEventListener('click', () => { boton.disabled = true; correr(); });

        async function correr() {
            await indexedDB.deleteDatabase('denuncia_ciudadana');
            const frame = document.createElement('iframe');
            const cargada = new Promise((r) => frame.addEventListener('load', r));
            frame.src = '../index.html';
            document.getElementById('host').appendChild(frame);
            await cargada;

            try {
                await espera(300);
                const d = frame.contentDocument, w = frame.contentWindow;
                const store = w.reporteStore;
                const panel = () => d.getElementById('vista-panel');
                const publica = () => d.getElementById('vista-publica');
                const tarjetas = () => [...panel().querySelectorAll('.reporte')];
                const aviso = () => panel().querySelector('.panel-aviso')?.textContent ?? '';
                const irA = async (hash) => { w.location.hash = hash; await espera(350); };

                // Datos de prueba: 3 pendientes y 1 ya validado.
                const foto = new Blob([new Uint8Array([137, 80, 78, 71])], { type: 'image/png' });
                const base = (categoria, ubicacion, fecha) => ({
                    foto, categoria, ubicacion, fecha, estado: 'pendiente', motivo: null, refOriginal: null,
                });
                const idA = await store.saveReport(base('bache', 'Colonia Nueva', '2026-09-05T10:00:00.000Z'));
                const idB = await store.saveReport(base('basura', 'Villafontana', '2026-09-06T10:00:00.000Z'));
                const idC = await store.saveReport(base('punto-riesgo', '<img src=x onerror="window.HACKEADO=1">', '2026-09-04T10:00:00.000Z'));
                await store.saveReport({ ...base('alumbrado', 'Pro Hogar', '2026-09-03T10:00:00.000Z'), estado: 'validado' });

                // --- Control de acceso por URL secreta ---
                await irA('');
                comprobar(panel().hidden && !publica().hidden, 'sin token: panel oculto y vista pública visible');
                comprobar(panel().children.length === 0, 'sin token: el panel ni siquiera se pinta');
                comprobar(!d.body.textContent.includes('validación'), 'sin token: la página no revela que exista un panel');

                await irA(RUTA_PANEL + 'token-inventado-123');
                comprobar(panel().hidden && !publica().hidden, 'token incorrecto: sigue la vista pública, sin mensajes');

                await irA(RUTA_PANEL + TOKEN_PANEL);
                comprobar(!panel().hidden && publica().hidden, 'token correcto: se muestra el panel');

                // --- Listado ---
                comprobar(tarjetas().length === 3, 'solo lista pendientes (3 de 4 reportes)');
                comprobar(!panel().textContent.includes('Pro Hogar'), 'el reporte ya validado no aparece');
                comprobar(tarjetas()[0].querySelector('.categoria').textContent === 'Basura acumulada',
                    'ordena del más reciente al más antiguo');
                comprobar(tarjetas().every((t) => t.querySelector('.miniatura img')?.src.startsWith('blob:')),
                    'cada tarjeta pinta la miniatura desde el blob');
                comprobar(panel().textContent.includes('Colonia Nueva'), 'muestra la ubicación');
                comprobar(/\d{1,2} \w+ 2026, \d{1,2}:\d{2}/.test(panel().textContent), 'muestra la fecha formateada');
                comprobar(panel().textContent.includes('ID ' + idA.slice(0, 8)), 'muestra el id corto del reporte');
                comprobar(!w.HACKEADO && panel().textContent.includes('<img src=x'),
                    'la ubicación se pinta como texto, no como HTML');

                // --- Validar ---
                const tarjetaDe = (id) => tarjetas().find((t) => t.textContent.includes(id.slice(0, 8)));
                tarjetaDe(idA).querySelector('.btn-principal').click();
                await espera(350);
                comprobar((await store.getReportById(idA)).estado === 'validado', 'validar cambia el estado a "validado"');
                comprobar(!tarjetaDe(idA) && tarjetas().length === 2, 'el reporte validado desaparece de pendientes');
                comprobar(aviso().includes('validado'), 'el panel avisa el resultado de la acción');

                // --- Descartar ---
                tarjetaDe(idB).querySelector('.btn-peligro').click();
                await espera(150);
                const detalle = tarjetaDe(idB).querySelector('.accion-detalle');
                comprobar(detalle.querySelectorAll('input[type=radio]').length === 3, 'descartar ofrece los 3 motivos');
                detalle.querySelector('.btn-peligro').click();
                await espera(250);
                comprobar(aviso().includes('motivo') && (await store.getReportById(idB)).estado === 'pendiente',
                    'descartar sin motivo se bloquea y el reporte sigue pendiente');
                detalle.querySelector('input[value="spam"]').checked = true;
                detalle.querySelector('.btn-peligro').click();
                await espera(350);
                const descartado = await store.getReportById(idB);
                comprobar(descartado.estado === 'descartado' && descartado.motivo === 'spam',
                    'descartar guarda estado y motivo');
                comprobar(!tarjetaDe(idB), 'el descartado sale de la lista');

                // --- Fusionar ---
                tarjetaDe(idC).querySelector('.btn-secundario').click();
                await espera(300);
                const cajaFusion = tarjetaDe(idC).querySelector('.accion-detalle');
                const select = cajaFusion.querySelector('select');
                const opciones = [...select.options].map((o) => o.value);
                comprobar(opciones.includes(idA) && !opciones.includes(idC) && !opciones.includes(idB),
                    'candidatos de fusión: incluye vivos, excluye el propio y el descartado');
                select.value = idA;
                cajaFusion.querySelector('.btn-principal').click();
                await espera(350);
                const fusionado = await store.getReportById(idC);
                comprobar(fusionado.estado === 'fusionado' && fusionado.refOriginal === idA,
                    'fusionar guarda estado y referencia al original');
                comprobar(tarjetas().length === 0 && panel().textContent.includes('No hay reportes pendientes'),
                    'la lista vacía muestra su mensaje');

                // --- Reglas del gestor, sin interfaz de por medio ---
                const gestor = new GestorValidacion(new ReporteStore());
                const falla = async (fn, etiqueta) => {
                    try { await fn(); comprobar(false, etiqueta + ': NO lanzó error'); }
                    catch (error) { comprobar(true, etiqueta + ' → "' + error.message + '"'); }
                };
                await falla(() => gestor.descartar(idA, 'porque-si'), 'motivo inválido');
                await falla(() => gestor.descartar(idA, ''), 'motivo vacío');
                await falla(() => gestor.fusionar(idA, idA), 'fusionar consigo mismo');
                await falla(() => gestor.fusionar(idA, 'id-que-no-existe'), 'fusionar con id inexistente');
                await falla(() => gestor.fusionar(idA, idB), 'fusionar contra un reporte descartado');

                await irA('');
                comprobar(panel().hidden && !publica().hidden, 'volver al hash vacío regresa a la vista pública');
            } catch (error) {
                comprobar(false, 'excepción inesperada: ' + error.message);
            }

            const resumen = document.getElementById('resumen');
            resumen.textContent = `${pasadas} pasadas, ${fallidas} fallidas`;
            resumen.className = fallidas ? 'fail' : 'ok';
        }
    </script>
</body>

</html>
